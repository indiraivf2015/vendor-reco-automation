# Vendor Master Reconciliation — autoreco.indiraivf.in
#
# Install:
#   sudo cp deploy/nginx/autoreco.indiraivf.in.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/autoreco.indiraivf.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust `root` if the repo path on the server changes.

server {
    listen 80;
    server_name autoreco.indiraivf.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name autoreco.indiraivf.in;

    include snippets/ssl-indiraivf.conf;

    # Must match actual clone path on server; dist/ must exist after: cd frontend && npm run build
    root /home/aiadmin/vendor-master/vendor-reco-automation/frontend/dist;
    error_log /var/log/nginx/autoreco.error.log warn;
    index index.html;

    # P2P / ERP Excel uploads — backend accepts up to 500 MB (multer limit in uploads.controller.ts)
    client_max_body_size 500M;
    client_body_timeout 600s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Large Excel uploads (P2P / ERP vendor files)
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
