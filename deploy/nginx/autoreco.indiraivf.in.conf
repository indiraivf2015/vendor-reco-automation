# Vendor Master Reconciliation — autoreco.indiraivf.in
#
# Install:
#   sudo cp deploy/nginx/autoreco.indiraivf.in.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/autoreco.indiraivf.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust `root` below if the app is deployed outside /home/aiadmin/vendor_latest.

server {
    listen 80;
    server_name autoreco.indiraivf.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name autoreco.indiraivf.in;

    include snippets/ssl-indiraivf.conf;

    root /home/aiadmin/vendor_latest/frontend/dist;
    index index.html;
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Large Excel uploads (P2P / ERP vendor files)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
